<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32" viewBox="0 0 32 32">
  <!-- Bee cursor prepared with assistance from ChatGPT. -->

  <!-- Antennae -->
  <path d="M14 8 L11 3 M18 8 L21 3"
        fill="none" stroke="#172132"
        stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="16" cy="10" r="4" fill="#172132"/>

  <!-- Stinger -->
  <path d="M14 26 L16 31 L18 26 Z" fill="#172132"/>

  <!-- Body -->
  <ellipse cx="16" cy="20" rx="6" ry="8" fill="#FFD34E"/>

  <!-- Body stripes -->
  <clipPath id="bee-body">
    <ellipse cx="16" cy="20" rx="6" ry="8"/>
  </clipPath>
  <g clip-path="url(#bee-body)" fill="#172132">
    <rect x="9" y="15" width="14" height="3"/>
    <rect x="9" y="21" width="14" height="3"/>
  </g>
  <ellipse cx="16" cy="20" rx="6" ry="8"
           fill="none" stroke="#172132"/>

  <!-- Wings appear above the body and point down -->
  <g fill="#E5F6FF" fill-opacity="0.9"
     stroke="#92C9DF" stroke-width="1" stroke-linejoin="round">
    <path d="M15 13 C10 11 2 18 4 25 C5 30 12 26 15 17 Z"/>
    <path d="M17 13 C22 11 30 18 28 25 C27 30 20 26 17 17 Z"/>
  </g>
</svg>
